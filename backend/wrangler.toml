# Maun relay: Cloudflare Worker + Durable Object mailbox.
# The name must match the Worker's name in the Cloudflare dashboard.
name = "maun"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Settings made in the Cloudflare dashboard (Settings > Variables and Secrets)
# survive a deploy from this file.
keep_vars = true

# Member-only mode is switched on by such settings:
#   ADMIN_EMAIL     the administrator's email address
#   ADMIN_PASSWORD  (as a Secret) the password of the admin page, ten
#                   characters or more; without it the page lets nobody in
#   ADMIN_HOST      optional: a host name of its own for the admin page, for
#                   example "admin.example.com". Add it to the Worker as a
#                   Custom Domain too. The page then exists only there.
#   RESEND_API_KEY  (as a Secret) the key of the mail service that sends the
#                   login codes; or BREVO_API_KEY to use Brevo instead
#   MAIL_FROM       the sender, for example "Maun <login@your-domain.com>"
# Without the first two the relay is open, as before: anyone may make an ID.
# The administrator's page is at <this relay>/admin, or at ADMIN_HOST.

# Zero tracking: do not ship request logs to Workers Logs.
[observability]
enabled = false

# Encrypted files, kept for one day. Created by the first deploy if it does
# not exist.
[[r2_buckets]]
binding = "FILES"
bucket_name = "maun-files"

# The member list of a member-only relay (see src/members.ts). Created by the
# first deploy if it does not exist; an open relay never writes to it.
[[d1_databases]]
binding = "DB"
database_name = "maun"

# Every hour: delete files older than a day.
[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

# SQLite-backed Durable Objects are the only kind available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# Rate limits. Counts are approximate and kept per Cloudflare location; the
# keys (an IP address or a mailbox ID) are never written to our own storage.
# Mobile networks put many people behind one address, so the per-address
# limits are generous.

# Connections opened from one IP address.
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "4101"

  [ratelimits.simple]
  limit = 120
  period = 60

# Connections opened to one mailbox, whoever opens them.
[[ratelimits]]
name = "MAILBOX_LIMIT"
namespace_id = "4102"

  [ratelimits.simple]
  limit = 20
  period = 60

# Connections from one IP address to mailboxes that have no account yet.
# Each of these is a possible new account.
[[ratelimits]]
name = "SIGNUP_LIMIT"
namespace_id = "4103"

  [ratelimits.simple]
  limit = 10
  period = 60

# Messages sent and pre-keys fetched by one account. A delivered message is
# answered with a receipt, which counts too, so this is about one message a
# second in each direction.
[[ratelimits]]
name = "SEND_LIMIT"
namespace_id = "4104"

  [ratelimits.simple]
  limit = 120
  period = 60
