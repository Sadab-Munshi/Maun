name: Android

# Tests and builds the app on every change, and keeps the debug APK as a
# downloadable artifact. The signed release build on version tags is added in
# Milestone 6.

on:
  push:
    branches: [main]
    paths: ["android/**", "backend/src/**", "backend/wrangler.toml", ".github/workflows/build-android.yml"]
  pull_request:
    paths: ["android/**", "backend/src/**", "backend/wrangler.toml", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repository variable (Settings > Secrets and variables > Actions > Variables).
      # Optional: when empty, the app asks for the relay address on screen.
      MAUN_RELAY_URL: ${{ vars.MAUN_RELAY_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the NDK
        # Needed only to strip debug symbols from libsignal and SQLCipher.
        # Without it the build still passes but the APK is about 250 MB.
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "Installing NDK $ndk"
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start a local relay
        # The app's connection tests register and log in against the real relay
        # code, running in Cloudflare's local runtime. Nothing is deployed.
        working-directory: backend
        run: |
          npm ci
          nohup npx wrangler dev --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::The local relay did not start"
          cat "$RUNNER_TEMP/relay.log"
          exit 1

      - name: Unit tests
        env:
          MAUN_TEST_RELAY_URL: http://127.0.0.1:8787
        run: ./gradlew :app:testDebugUnitTest

      - name: Check that the connection tests really ran
        # They skip themselves when no relay is configured. Here one is, so a
        # skip would mean the app and the relay were never tested together.
        run: |
          report=app/build/test-results/testDebugUnitTest/TEST-org.maun.messenger.network.RelayConnectionTest.xml
          grep -o '<testsuite [^>]*>' "$report"
          if ! grep -q 'skipped="0"' "$report"; then
            echo "::error::Connection tests were skipped"
            exit 1
          fi

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Check APK size
        run: |
          size=$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK is $((size / 1024 / 1024)) MB"
          if [ "$size" -gt $((100 * 1024 * 1024)) ]; then
            echo "::error::The APK is over 100 MB. The native libraries were probably not stripped."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: maun-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
