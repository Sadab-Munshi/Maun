name: Android

# Tests and builds the app on every change, and keeps the debug APK as a
# downloadable artifact. The signed release build on version tags is added in
# Milestone 6.

on:
  push:
    branches: [main]
    paths: ["android/**", "backend/src/**", "backend/scripts/**", "backend/wrangler.toml", ".github/workflows/build-android.yml"]
  pull_request:
    paths: ["android/**", "backend/src/**", "backend/scripts/**", "backend/wrangler.toml", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repository variable (Settings > Secrets and variables > Actions > Variables).
      # Optional: when empty, the app is built for the relay named in app/build.gradle.kts.
      MAUN_RELAY_URL: ${{ vars.MAUN_RELAY_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the NDK
        # Needed only to strip debug symbols from libsignal and SQLCipher.
        # Without it the build still passes but the APK is about 250 MB.
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "Installing NDK $ndk"
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start a local relay
        # The app's connection and messaging tests run against the real relay
        # code in Cloudflare's local runtime. Nothing is deployed. The script
        # lifts the per-address connection limits, because here every test
        # phone connects from the same address.
        working-directory: backend
        run: |
          npm ci
          nohup ./scripts/test-relay.sh 8787 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::The local relay did not start"
          cat "$RUNNER_TEMP/relay.log"
          exit 1

      - name: Unit tests
        env:
          MAUN_TEST_RELAY_URL: http://127.0.0.1:8787
        run: ./gradlew :app:testDebugUnitTest

      - name: Check that the relay tests really ran
        # They skip themselves when no relay is configured. Here one is, so a
        # skip would mean the app and the relay were never tested together.
        run: |
          for name in network.RelayConnectionTest ChatEngineTest; do
            report="app/build/test-results/testDebugUnitTest/TEST-org.maun.messenger.$name.xml"
            grep -o '<testsuite [^>]*>' "$report"
            if ! grep -q 'skipped="0"' "$report"; then
              echo "::error::$name was skipped"
              exit 1
            fi
          done

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Check APK size
        # One APK per phone architecture, so a download carries one copy of the
        # calling and encryption libraries rather than two.
        #
        # With the map renderer's native library compressed inside the APK,
        # arm64 comes to about 31 MB and armeabi-v7a to 28 MB. The budget stays
        # at 40 MB: if it is ever reached, something is wrong rather than big.
        run: |
          status=0
          for apk in app/build/outputs/apk/debug/*.apk; do
            size=$(stat -c %s "$apk")
            echo "$apk is $((size / 1024 / 1024)) MB"
            if [ "$size" -gt $((40 * 1024 * 1024)) ]; then
              echo "::error::$apk is over 40 MB. Check that shrinking is on, the native libraries are stripped, and no architecture was added to every APK."
              status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: maun-debug-apk
          # arm64-v8a is every phone made since about 2015; armeabi-v7a is for older ones.
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check that the database schema is committed
        # Room writes the schema of the current database version while
        # compiling. Upgrades are generated from these files, so a version
        # that is not in the repository could not be upgraded from later.
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --short -- app/schemas
            echo "::error::android/app/schemas has changed. Commit the files from the database-schemas artifact."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-schemas
          path: android/app/schemas
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
            ${{ runner.temp }}/relay.log
