name: Release

# Builds the signed release APK. It runs on every push that touches the app, so
# a broken release build is caught the same day, but it publishes nothing by
# itself: a GitHub Release is made only when this is started by hand with
# "publish" ticked. The version in the APK is what the in-app update check
# compares against, so publishing is a deliberate act.

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as a GitHub Release (the in-app update check reads it)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

env:
  # The SHA-256 of the release certificate. Every release must be signed with
  # this key, or a phone that already has Maun cannot install the update at all.
  # Changing it means every installed copy has to be removed first.
  EXPECTED_CERT_SHA256: "35564CDE8213C64B4354421DC57523E7591979A466FD5E0EA81CF4D91C5B41FD"

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the NDK
        # Only to strip debug symbols from libsignal, SQLCipher and WebRTC.
        # Without it the build still succeeds, and the APK is three times the
        # size: 92 MB against 30 MB.
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "Installing NDK $ndk"
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MAUN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MAUN_KEYSTORE_BASE64 is not set: a release must be signed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maun-release.jks"
          echo "Keystore written, $(stat -c%s "$RUNNER_TEMP/maun-release.jks") bytes"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build the signed release APK
        env:
          MAUN_KEYSTORE_FILE: ${{ runner.temp }}/maun-release.jks
          MAUN_KEYSTORE_PASSWORD: ${{ secrets.MAUN_KEYSTORE_PASSWORD }}
          MAUN_KEY_ALIAS: ${{ secrets.MAUN_KEY_ALIAS }}
          MAUN_KEY_PASSWORD: ${{ secrets.MAUN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Check the signature, the version and the size
        run: |
          set -euo pipefail
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          version_code=$(
            "$AAPT2" dump badging app/build/outputs/apk/release/*.apk 2>/dev/null |
              head -1 | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p"
          )
          version_name=$(
            "$AAPT2" dump badging app/build/outputs/apk/release/*.apk 2>/dev/null |
              head -1 | sed -n "s/.*versionName='\([^']*\)'.*/\1/p"
          )
          package=$(
            "$AAPT2" dump badging app/build/outputs/apk/release/*.apk 2>/dev/null |
              head -1 | sed -n "s/package: name='\([^']*\)'.*/\1/p"
          )
          echo "package=$package versionName=$version_name versionCode=$version_code"
          if [ "$package" != "org.maun.messenger" ]; then
            echo "::error::The application ID changed. An update would install as a second app."
            exit 1
          fi
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk"
            badging=$("$AAPT2" dump badging "$apk")
            echo "$badging" | grep -E "^sdkVersion|^targetSdkVersion|^native-code|application-debuggable" || true
            if echo "$badging" | grep -q "application-debuggable"; then
              echo "::error::$apk is a debuggable build; a release must not be."
              exit 1
            fi
            "$APKSIGNER" verify --print-certs "$apk" > /tmp/certs.txt
            sed -n '1,6p' /tmp/certs.txt
            # "Signer #1 certificate SHA-256 digest: 3556…" — the digest is last.
            cert=$(sed -n 's/.*certificate SHA-256 digest: *//p' /tmp/certs.txt | tr -d ' \t' | tr 'a-f' 'A-F')
            expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ' ')
            echo "signed with $cert"
            if [ "$cert" != "$expected" ]; then
              echo "::error::Signed with $cert, expected $expected."
              exit 1
            fi
            size=$(stat -c%s "$apk")
            echo "size=$((size / 1024 / 1024)) MB"
            if [ "$size" -gt $((40 * 1024 * 1024)) ]; then
              echo "::error::Over the 40 MB limit."
              exit 1
            fi
          done
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: What is in the APK, largest first
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== $apk"
            unzip -l "$apk" | sort -k1 -n | tail -12
          done

      - name: Name the APKs for the update check
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -n 's/.*-\(arm64-v8a\|armeabi-v7a\|universal\).*/\1/p')
            [ -n "$abi" ] || abi=universal
            # The version code is in the name: the app reads it from here.
            out="maun-$VERSION_NAME-$VERSION_CODE-$abi.apk"
            cp "$apk" "$RUNNER_TEMP/release/$out"
            echo "$out"
          done
          ls -l "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v7
        with:
          name: maun-release-apk
          path: ${{ runner.temp }}/release/*.apk
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          notes=$(cat <<NOTES
          Maun $VERSION_NAME (versionCode $VERSION_CODE).

          Signed with Maun's permanent release key. Updating keeps your chats,
          keys, contacts, settings, saved media and login: do not uninstall.

          Install the file for your phone's processor:
          arm64-v8a for nearly every phone made since 2016.
          NOTES
          )
          gh release create "$tag" "$RUNNER_TEMP"/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Maun $VERSION_NAME" \
            --notes "$notes" \
            --latest
