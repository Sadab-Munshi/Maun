name: Backend

# Tests the relay on every change; deploys it to Cloudflare from main.

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Explain why nothing was deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::The CLOUDFLARE_API_TOKEN secret is not set, so the relay was not deployed. See README.md."
